name: Documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "README.md"
      - "docs/**"
      - "great-docs.yml"
      - "OrthoEvol/**"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "README.md"
      - "docs/**"
      - "great-docs.yml"
      - "OrthoEvol/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install documentation environment
        run: |
          python -m pip install uv
          uv sync --extra docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build documentation
        run: uv run great-docs build --no-refresh

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Explain local PR preview
        if: github.event_name == 'pull_request'
        run: uv run great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: Publish docs
    needs: build-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: Preview docs
    needs: build-docs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Post preview instructions
        continue-on-error: true
        run: pipx run great-docs==0.17.0 ci pr-comment --run ${{ github.run_id }} --pr ${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
